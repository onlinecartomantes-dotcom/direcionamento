<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Aguarde Atendimento</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    linear-gradient(180deg,#fff7c2 0%,#f8dd71 35%,#e0b62d 70%,#c99810 100%);
  font-family:'Poppins',sans-serif;
}

.box{
  width:100%;
  max-width:520px;
  background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(6px);
  border-radius:28px;
  padding:42px 28px;
  text-align:center;
  box-shadow:
    0 20px 40px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.45);
}

h1{
  font-family:'Cinzel',serif;
  font-size:38px;
  line-height:1.2;
  color:#5c3a00;
  letter-spacing:1px;
  margin-bottom:18px;
  text-shadow:0 2px 4px rgba(255,255,255,.35);
}

p{
  font-size:22px;
  line-height:1.6;
  color:#6b4300;
  font-weight:500;
}
</style>
</head>

<body>

<div class="box">
  <h1>Aguarde</h1>
  <p>Estamos iniciando seu atendimento</p>
</div>

<script>
const DESTINO =
"https://atendimento2-8kie.onrender.com/?role=cliente&room=main";

async function iniciar(){

  try{
    await fetch(DESTINO,{
      method:"GET",
      cache:"no-store",
      mode:"no-cors"
    });
  }catch(e){}

  setTimeout(()=>{
    window.location.href = DESTINO;
  },3000);
}

iniciar();
</script>

</body>
</html>
